packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
# 依赖全部钉死精确版本；DSH 生态的 pnpm minimumReleaseAge 默认按 1440 分钟（1 天）拦截新发布，
# 这里逐条登记本包钉死的确切版本，保证首次安装不会被“发布未满 1 天”挡下。
minimumReleaseAgeExclude:
  - '@goodandready/dsh-context-lens@0.1.28'
  - 'dsh-cost-meter@1.9.30'
  - '@linxin666/dsh-client-ui-git-graph@0.4.8'
  - 'dsh-effort-slider@1.3.1'
  - 'dsh-pet@0.3.8'
  - '@michengai/dsh-btw@1.0.4'
  - '@michengai/dsh-simplify@1.0.1'
  - '@michengai/dsh-code-review@1.0.1'
  - 'dsh-computer-use-win@0.2.3'
  - '@nanmicoder/dsh-agent-teams@0.1.26'
  - 'dsh-context@0.74.0'
  - 'dsh-plugin-subagent-director@0.6.0-beta.2'
  - '@mrweicodes/dsh-loop-guard@1.0.8'
  - '@modusensus/dsh-mneme@0.8.13'
  - '@liustack/modlens@3.26.6'
  - 'dsh-plugin-wallpaper-engine@1.2.0'
  - '@goodandready/dsh-key-limits@0.2.19'
  - 'dsh-workbuddy-connect@0.7.9'

# ── pnpm 12 的依赖 build script 闸门（v1.0.1 修复启动器安装失败）──────────────
# pnpm 12 默认把「带 install/prepare 脚本但没被批准的依赖」当成错误直接退出：
#   Error: ERR_PNPM_IGNORED_BUILDS / Ignored build scripts: @google/genai, protobufjs
# 本包的来源链条是：dsh-workbuddy-connect → @earendil-works/pi-ai → @google/genai（prepare）
#   → protobufjs（postinstall）。这两个脚本对运行时没有作用，本包不需要执行它们：
#   · 显式登记为 ignored（记录我们的知情决定）
#   · strictDepBuilds: false（关键：pnpm 12 里 onlyBuiltDependencies / ignoredBuiltDependencies
#     都不再是放行开关，只有这个开关能把 ERR_PNPM_IGNORED_BUILDS 从「致命错误」降级为「跳过」）
strictDepBuilds: false
ignoredBuiltDependencies:
  - '@google/genai'
  - 'protobufjs'

# ── dsh-ops 走包内 vendored fork（v1.0.3-pre.2 修复启动器安装失败）────────────
# package.json 里写 `"dsh-ops": "link:./dsh-ops"`：
#   · 安装时 `<profile>/dsh-ops` 还不存在，pnpm 只建一个指向它的 junction（打印一条
#     WARN，不报错）；安装完成后 launcher 把 dspack 的 `overrides/` 覆盖到 profile 根，
#     `overrides/dsh-ops/` 就落到 `<profile>/dsh-ops/`，junction 随即生效。
#   · 产物本身是 fork 的 GitHub Release tgz，固定在 vendor/ 里（打包脚本校验 sha512），
#     因此安装期不需要访问 github.com —— 这正是 pre.1 崩溃（0xc0000409）的原因。
#   · 不要把它改回 https://github.com/...tgz 的 URL 依赖。
#
# 另外一个必须同步维护的点：`link:` 不会安装被链接包自己的 optionalDependencies，
# 所以 dsh-ops 声明的 Windows bash 载荷 `@dsh-ops/bash-win32-x64@0.2.1` 必须写进
# package.json / manifest.json 的 dependencies（从 registry.npmjs.org 拉取）。
# 漏掉它不会报错，只会让 `ops_bash` 静默消失（resolveShells 报 declared but not installed）。